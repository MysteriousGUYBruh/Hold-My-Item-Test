buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
group = "com.holdmyitem"
archivesBaseName = "holdmyitem-1.12.2"

sourceCompatibility = targetCompatibility = '1.8'

sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
        resources {
            srcDirs = ['.']
            include 'mcmod.info'
        }
    }
}

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"
    mappings = "stable_39"
}
